<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>吴家阅读打卡</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="container">
  <div class="login-logo">
    <div class="big">📚</div>
    <h1>吴家阅读打卡</h1>
    <p>每天中文 5 分钟 + 英文 5 分钟</p>
  </div>

  <div class="card" id="studentCard">
    <div style="text-align:center; color:var(--sub); font-size:14px;">点你的头像，直接开始 🎙️</div>
    <div class="student-grid">
      <button class="student-btn" data-u="wuyou">
        <span class="avatar">🐾</span>无花果<small>吴悠 · 五年级</small>
      </button>
      <button class="student-btn" data-u="wushuang">
        <span class="avatar">🍐</span>妹妹<small>吴双 · 三年级</small>
      </button>
      <button class="student-btn" data-u="xiaofan">
        <span class="avatar">⭐</span>小凡<small>小凡 · 五年级</small>
      </button>
    </div>
  </div>

  <div class="card hidden" id="loginCard">
    <h2 style="justify-content:center;" id="loginTitle">家长后台登录 🔐</h2>
    <form class="login-form" id="loginForm">
      <input class="input" id="username" placeholder="用户名" autocomplete="username" readonly>
      <input class="input" id="password" type="password" placeholder="密码" autocomplete="current-password">
      <button class="btn btn-orange btn-block" type="submit">进入后台</button>
      <button class="btn btn-ghost btn-block" type="button" id="backBtn">← 返回</button>
    </form>
  </div>

  <div class="card home-calendar-card">
    <div class="calendar-heading">
      <h2>📅 近期打卡</h2>
      <div class="calendar-nav">
        <button type="button" id="calendarPrev" aria-label="上月">‹</button>
        <span id="calendarMonth"></span>
        <button type="button" id="calendarNext" aria-label="下月">›</button>
      </div>
    </div>
    <div id="homeCalendar" aria-live="polite"></div>
  </div>

  <div class="owner-link">
    <button id="ownerBtn">我是家长 👨‍👩‍👧‍👦 登录后台</button>
  </div>
</div>

<script src="/app.js"></script>
<script>
const studentCard = document.getElementById('studentCard');
const loginCard = document.getElementById('loginCard');
const loginTitle = document.getElementById('loginTitle');
const username = document.getElementById('username');
const password = document.getElementById('password');
const form = document.getElementById('loginForm');
const iconByUsername = { wuyou: '🐾', wushuang: '🍐', xiaofan: '⭐' };
let calendarMonth = thisMonthCN();

function shiftMonth(month, offset) {
  const [year, monthNumber] = month.split('-').map(Number);
  const date = new Date(year, monthNumber - 1 + offset, 1);
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
}

async function loadHomeCalendar() {
  const calendar = document.getElementById('homeCalendar');
  calendar.innerHTML = '<div class="calendar-message">加载中…</div>';
  try {
    const data = await fetch(`/api/calendar?month=${encodeURIComponent(calendarMonth)}`, { cache: 'no-store' }).then(async res => {
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || '日历加载失败');
      return body;
    });
    calendarMonth = data.month;
    const [year, monthNumber] = calendarMonth.split('-').map(Number);
    document.getElementById('calendarMonth').textContent = `${year}年${monthNumber}月`;
    const firstDay = new Date(year, monthNumber - 1, 1);
    const leadingBlanks = (firstDay.getDay() + 6) % 7;
    const daysInMonth = new Date(year, monthNumber, 0).getDate();
    let html = '<div class="calendar home-calendar">';
    ['一', '二', '三', '四', '五', '六', '日'].forEach(day => { html += `<div class="dow">${day}</div>`; });
    for (let i = 0; i < leadingBlanks; i++) html += '<div></div>';
    for (let day = 1; day <= daysInMonth; day++) {
      const date = `${calendarMonth}-${String(day).padStart(2, '0')}`;
      const status = data.days[date] || {};
      const icons = data.students.map(student => {
        const icon = iconByUsername[student.username] || '●';
        const active = status[student.id] === true;
        return `<i class="${active ? 'checked' : 'unchecked'}" title="${student.name}${active ? '已打卡' : '未打卡'}">${icon}</i>`;
      }).join('');
      html += `<div class="day${date === todayCN() ? ' today' : ''}"><span class="day-number">${day}</span><span class="day-icons">${icons}</span></div>`;
    }
    calendar.innerHTML = html + '</div>';
  } catch (error) {
    document.getElementById('calendarMonth').textContent = calendarMonth;
    calendar.innerHTML = `<div class="calendar-message">${error.message}</div>`;
  }
}

document.getElementById('calendarPrev').addEventListener('click', () => {
  calendarMonth = shiftMonth(calendarMonth, -1);
  loadHomeCalendar();
});
document.getElementById('calendarNext').addEventListener('click', () => {
  calendarMonth = shiftMonth(calendarMonth, 1);
  loadHomeCalendar();
});
loadHomeCalendar();

// 学生：点击头像直接进入（免密）
document.querySelectorAll('.student-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    try {
      const data = await api('/api/student-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: btn.dataset.u }),
      });
      location.href = data.redirect || '/checkin';
    } catch (e) {
      toast(e.message);
      btn.disabled = false;
    }
  });
});

// 家长：密码登录后台
document.getElementById('ownerBtn').addEventListener('click', () => {
  username.value = 'admin';
  loginTitle.textContent = '家长后台登录 🔐';
  username.readOnly = true;
  studentCard.classList.add('hidden');
  loginCard.classList.remove('hidden');
  password.focus();
});

document.getElementById('backBtn').addEventListener('click', () => {
  loginCard.classList.add('hidden');
  studentCard.classList.remove('hidden');
  password.value = '';
});

form.addEventListener('submit', async e => {
  e.preventDefault();
  const btn = form.querySelector('button[type=submit]');
  btn.disabled = true;
  try {
    const data = await api('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username.value.trim(), password: password.value }),
    });
    location.href = data.redirect || '/admin';
  } catch (err) {
    toast(err.message);
    btn.disabled = false;
  }
});
</script>
</body>
</html>
