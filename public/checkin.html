<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>阅读打卡</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="container">
  <div class="topbar">
    <h1>📚 阅读打卡</h1>
    <div class="right"><button class="btn-link" onclick="location.href='/'">🏠 主页</button><span id="userName"></span><button class="btn-link" onclick="logout()">退出</button></div>
  </div>
  <p style="color:var(--sub); font-size:14px; margin-bottom:8px;"><span id="dateLabel">今天</span> <b id="today"></b> · 每天中文 + 英文各 5 分钟 🎙️</p>
  <div class="date-bar" id="dateBar">
    <span id="dateBarText"></span>
    <button class="hidden" type="button" id="backToday">返回今天</button>
  </div>

  <!-- 今日状态 -->
  <div class="card">
    <h2 id="statusTitle">🗓️ 今日打卡</h2>
    <div id="todayStatus" style="font-size:14px; color:var(--sub);">加载中…</div>
  </div>

  <!-- 中文录音 -->
  <div class="card rec-card" id="card-cn">
    <h2>🇨🇳 中文朗读 <span class="status-tag tag-none" id="tag-cn">未打卡</span></h2>
    <div id="rec-cn-area">
      <div class="rec-timer" id="timer-cn">0:00</div>
      <div class="rec-hint" id="hint-cn">点击下方按钮开始录音，5 分钟到会自动停止</div>
      <div class="rec-actions">
        <button class="btn btn-orange" id="start-cn">🎙️ 开始录音</button>
        <button class="btn btn-orange hidden" id="pause-cn">⏸️ 暂停</button>
        <button class="btn btn-red hidden" id="stop-cn">⏹️ 停止</button>
        <button class="btn btn-green hidden" id="save-cn">✅ 保存</button>
        <button class="btn btn-ghost hidden" id="again-cn">🔄 重录</button>
      </div>
      <audio class="rec-audio hidden" id="preview-cn" controls></audio>
      <div class="rec-saved-info hidden" id="saved-cn"></div>
      <div class="score-info hidden" id="score-cn"></div>
    </div>
  </div>

  <!-- 英文录音 -->
  <div class="card rec-card" id="card-en">
    <h2>🇬🇧 English <span class="status-tag tag-none" id="tag-en">未打卡</span></h2>
    <div id="rec-en-area">
      <div class="rec-timer" id="timer-en">0:00</div>
      <div class="rec-hint" id="hint-en">点击下方按钮开始录音，5 分钟到会自动停止</div>
      <div class="rec-actions">
        <button class="btn btn-orange" id="start-en">🎙️ Start</button>
        <button class="btn btn-orange hidden" id="pause-en">⏸️ Pause</button>
        <button class="btn btn-red hidden" id="stop-en">⏹️ Stop</button>
        <button class="btn btn-green hidden" id="save-en">✅ Save</button>
        <button class="btn btn-ghost hidden" id="again-en">🔄 Redo</button>
      </div>
      <audio class="rec-audio hidden" id="preview-en" controls></audio>
      <div class="rec-saved-info hidden" id="saved-en"></div>
      <div class="score-info hidden" id="score-en"></div>
    </div>
  </div>

  <!-- 本月日历 -->
  <div class="card">
    <div class="calendar-heading">
      <h2>📅 打卡日历</h2>
      <div class="calendar-nav">
        <button type="button" id="calendarPrev" aria-label="上月">‹</button>
        <span id="calendarMonth"></span>
        <button type="button" id="calendarNext" aria-label="下月">›</button>
      </div>
    </div>
    <div id="calendar"></div>
  </div>
</div>

<script src="/app.js"></script>
<script>
(async () => {
const MAX_SEC = 300; // 5 分钟
const user = await guard(false);
if (!user) return;
let currentDate = todayCN();
let calendarMonth = thisMonthCN();
const scorePollTokens = { cn: 0, en: 0 };

function renderScore(lang, response) {
  const el = document.getElementById(`score-${lang}`);
  if (!response.enabled || !response.score) { el.classList.add('hidden'); return 'none'; }
  const s = response.score;
  el.classList.remove('hidden');
  if (s.status === 'pending') { el.textContent = '🔍 评分中…'; return 'pending'; }
  if (s.status === 'done') {
    el.textContent = `🏆 总分 ${Math.round(s.total)} · 发音 ${Math.round(s.accuracy)} · 流利度 ${Math.round(s.fluency * 100)}`;
    return 'done';
  }
  el.classList.add('hidden');
  el.textContent = '';
  return s.status;
}

async function loadScore(lang, poll = false, date = currentDate) {
  const token = ++scorePollTokens[lang];
  for (let attempt = 0; attempt < (poll ? 20 : 1); attempt++) {
    if (attempt) await new Promise(resolve => setTimeout(resolve, 3000));
    if (token !== scorePollTokens[lang] || date !== currentDate) return;
    try {
      const response = await api(`/api/score?date=${encodeURIComponent(date)}&lang=${lang}`);
      const status = renderScore(lang, response);
      if (status !== 'pending') return;
    } catch (_) { return; }
  }
  if (token === scorePollTokens[lang]) document.getElementById(`score-${lang}`).textContent = '暂未评分';
}

function yesterdayCN() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function isViewableDate(date) {
  return /^\d{4}-\d{2}-\d{2}$/.test(date) && date <= todayCN();
}

function updateDateHeader() {
  const isToday = currentDate === todayCN();
  const isYesterday = currentDate === yesterdayCN();
  document.getElementById('dateLabel').textContent = isToday ? '今天' : isYesterday ? '昨天' : '查看日期';
  document.getElementById('today').textContent = currentDate.replace(/-/g, '.');
  document.getElementById('statusTitle').textContent = isToday
    ? '🗓️ 今日打卡'
    : isYesterday ? '🗓️ 昨日补打卡' : `📖 查看记录 · ${currentDate}`;
  document.getElementById('dateBarText').textContent = isToday
    ? `今天 · ${currentDate}`
    : isYesterday
      ? `🔄 补打卡 ${currentDate}（昨天）`
      : '📖 查看打卡记录（仅可回听，补打卡限昨天）';
  document.getElementById('dateBar').classList.toggle('makeup', isYesterday);
  document.getElementById('dateBar').classList.toggle('view-only', !isToday && !isYesterday);
  document.getElementById('backToday').classList.toggle('hidden', isToday);
}

async function refreshStatus() {
  const requestedDate = currentDate;
  const t = await api('/api/today?date=' + encodeURIComponent(requestedDate));
  if (requestedDate !== currentDate) return;
  updateDateHeader();
  const parts = [];
  const cn = t.cn.saved ? `中文 ✅ ${fmtDur(t.cn.duration)}（${fmtTime(t.cn.uploadedAt)}）` : '中文 ⬜ 未打卡';
  const en = t.en.saved ? `英文 ✅ ${fmtDur(t.en.duration)}（${fmtTime(t.en.uploadedAt)}）` : '英文 ⬜ 未打卡';
  document.getElementById('todayStatus').textContent = `${cn} ｜ ${en}`;
  syncCardState('cn', t.cn);
  syncCardState('en', t.en);
  loadScore('cn');
  loadScore('en');
  setRecordingAvailability();
}

function setRecordingAvailability() {
  const isViewOnly = currentDate < yesterdayCN();
  ['cn', 'en'].forEach(lang => {
    const buttons = ['start', 'pause', 'stop', 'save', 'again']
      .map(id => document.getElementById(`${id}-${lang}`));
    buttons.forEach(button => button.classList.add('hidden'));
    if (isViewOnly) {
      document.getElementById(`hint-${lang}`).textContent = '📖 该日期仅可查看回听，补打卡限昨天';
    } else {
      buttons[0].classList.remove('hidden');
      document.getElementById(`hint-${lang}`).textContent = '点击下方按钮开始录音，5 分钟到会自动停止';
    }
  });
}

function syncCardState(lang, st) {
  const tag = document.getElementById(`tag-${lang}`);
  const savedInfo = document.getElementById(`saved-${lang}`);
  if (st.saved) {
    tag.textContent = '已打卡';
    tag.className = 'status-tag tag-done';
    const savedSuffix = currentDate < yesterdayCN() ? '' : '（可直接重录覆盖）';
    savedInfo.textContent = `已保存 · 时长 ${fmtDur(st.duration)} · ${fmtTime(st.uploadedAt)}${savedSuffix} `;
    const listenBtn = document.createElement('button');
    listenBtn.type = 'button';
    listenBtn.className = 'btn btn-ghost';
    listenBtn.textContent = '🎧 回听';
    listenBtn.addEventListener('click', async () => {
      const preview = document.getElementById(`preview-${lang}`);
      preview.src = st.url;
      preview.classList.remove('hidden');
      try {
        await preview.play();
      } catch (e) {
        toast('无法播放录音，请稍后重试');
      }
    });
    savedInfo.appendChild(listenBtn);
    savedInfo.classList.remove('hidden');
  } else {
    tag.textContent = '未打卡';
    tag.className = 'status-tag tag-none';
    savedInfo.classList.add('hidden');
  }
}

// ---------- 录音逻辑 ----------
const state = {
  cn: null, en: null
};

function makeRecorder(lang) {
  const area = document.getElementById(`rec-${lang}-area`);
  const timerEl = document.getElementById(`timer-${lang}`);
  const hintEl = document.getElementById(`hint-${lang}`);
  const startBtn = document.getElementById(`start-${lang}`);
  const pauseBtn = document.getElementById(`pause-${lang}`);
  const stopBtn = document.getElementById(`stop-${lang}`);
  const saveBtn = document.getElementById(`save-${lang}`);
  const againBtn = document.getElementById(`again-${lang}`);
  const preview = document.getElementById(`preview-${lang}`);
  const card = document.getElementById(`card-${lang}`);
  const tag = document.getElementById(`tag-${lang}`);

  const rec = {
    lang, stream: null, recorder: null, chunks: [], timerInt: null, autoStop: null,
    accMs: 0, sessionStart: 0, blob: null, duration: 0, previewUrl: null,
  };
  state[lang] = rec;

  function setTag(cls, text) {
    tag.className = 'status-tag ' + cls;
    tag.textContent = text;
  }
  function show(...btns) {
    [startBtn, pauseBtn, stopBtn, saveBtn, againBtn].forEach(b => b.classList.add('hidden'));
    btns.forEach(b => b.classList.remove('hidden'));
  }
  function fmt(ms) {
    const s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  function elapsedMs() {
    const activeMs = rec.recorder && rec.recorder.state === 'recording'
      ? Date.now() - rec.sessionStart
      : 0;
    return Math.min(rec.accMs + activeMs, MAX_SEC * 1000);
  }
  function renderTimer() {
    timerEl.textContent = fmt(elapsedMs());
  }
  function scheduleAutoStop() {
    clearTimeout(rec.autoStop);
    const remaining = Math.max(0, MAX_SEC * 1000 - rec.accMs);
    rec.autoStop = setTimeout(stopRecording, remaining);
  }
  function stopRecording() {
    clearTimeout(rec.autoStop);
    clearInterval(rec.timerInt);
    if (!rec.recorder || rec.recorder.state === 'inactive') return;
    if (rec.recorder.state === 'recording') {
      rec.accMs = elapsedMs();
      rec.sessionStart = 0;
    }
    rec.recorder.stop();
  }
  function stopTracks() {
    if (rec.stream) rec.stream.getTracks().forEach(t => t.stop());
    rec.stream = null;
  }

  startBtn.addEventListener('click', async () => {
    const isViewOnly = currentDate < yesterdayCN();
    if (isViewOnly) {
      toast('该日期仅可查看，补打卡限昨天');
      return;
    }
    try {
      rec.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      toast('无法使用麦克风，请检查权限设置');
      return;
    }
    const types = ['audio/webm', 'audio/mp4', 'audio/ogg'];
    let mime = '';
    for (const t of types) { if (MediaRecorder.isTypeSupported(t)) { mime = t; break; } }
    rec.chunks = [];
    rec.recorder = new MediaRecorder(rec.stream, mime ? { mimeType: mime } : undefined);
    rec.recorder.ondataavailable = e => { if (e.data && e.data.size) rec.chunks.push(e.data); };
    rec.recorder.onstop = () => {
      clearInterval(rec.timerInt);
      clearTimeout(rec.autoStop);
      stopTracks();
      rec.blob = new Blob(rec.chunks, { type: rec.recorder.mimeType });
      rec.duration = Math.round(rec.accMs / 1000);
      rec.previewUrl = URL.createObjectURL(rec.blob);
      preview.src = rec.previewUrl;
      preview.classList.remove('hidden');
      timerEl.textContent = fmt(rec.duration * 1000);
      hintEl.textContent = rec.duration >= 5 ? `录了 ${fmt(rec.duration * 1000)}，听听效果，满意就保存 ✅` : '录音太短了，建议重录哦';
      show(saveBtn, againBtn);
      setTag('tag-part', '已录音');
    };
    rec.accMs = 0;
    rec.sessionStart = Date.now();
    rec.recorder.start();
    rec.timerInt = setInterval(renderTimer, 250);
    scheduleAutoStop();
    pauseBtn.textContent = lang === 'cn' ? '⏸️ 暂停' : '⏸️ Pause';
    show(pauseBtn, stopBtn);
    setTag('tag-rec', '录音中…');
    hintEl.textContent = `录音进行中，5:00 自动停止 · 请大声朗读 🗣️`;
    timerEl.style.color = 'var(--red)';
  });

  pauseBtn.addEventListener('click', () => {
    if (!rec.recorder) return;
    if (rec.recorder.state === 'recording') {
      rec.accMs = elapsedMs();
      rec.sessionStart = 0;
      rec.recorder.pause();
      clearInterval(rec.timerInt);
      clearTimeout(rec.autoStop);
      renderTimer();
      pauseBtn.textContent = lang === 'cn' ? '▶️ 继续' : '▶️ Resume';
      hintEl.textContent = '⏸️ 已暂停，点继续接着读';
      setTag('tag-part', '已暂停');
    } else if (rec.recorder.state === 'paused') {
      rec.sessionStart = Date.now();
      rec.recorder.resume();
      rec.timerInt = setInterval(renderTimer, 250);
      scheduleAutoStop();
      pauseBtn.textContent = lang === 'cn' ? '⏸️ 暂停' : '⏸️ Pause';
      hintEl.textContent = '录音进行中，5:00 自动停止 · 请大声朗读 🗣️';
      setTag('tag-rec', '录音中…');
    }
  });

  stopBtn.addEventListener('click', stopRecording);

  againBtn.addEventListener('click', () => {
    if (rec.previewUrl) URL.revokeObjectURL(rec.previewUrl);
    preview.classList.add('hidden');
    preview.src = '';
    rec.blob = null;
    timerEl.textContent = '0:00';
    timerEl.style.color = '';
    hintEl.textContent = '点击下方按钮开始录音，5 分钟到会自动停止';
    show(startBtn);
    setTag('tag-none', '未打卡');
  });

  saveBtn.addEventListener('click', async () => {
    if (!rec.blob) return;
    saveBtn.disabled = true;
    try {
      const upload = () => fetch('/api/audio?lang=' + lang + '&duration=' + rec.duration + '&date=' + encodeURIComponent(currentDate), {
        method: 'POST',
        headers: { 'Content-Type': rec.blob.type || 'audio/webm' },
        body: rec.blob,
      });
      let res = await upload();
      if (res.status === 401 && window.__checkinUser?.role === 'student') {
        await api('/api/student-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: window.__checkinUser.username }),
        });
        res = await upload();
      }
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '保存失败');
      toast('保存成功 🎉');
      timerEl.style.color = '';
      preview.classList.add('hidden');
      show(startBtn);
      await refreshStatus();
      if (data.scoring) {
        renderScore(lang, { enabled: true, score: { status: 'pending' } });
        loadScore(lang, true, currentDate);
      }
    } catch (e) {
      toast(e.message || '保存失败，请重试');
    } finally {
      saveBtn.disabled = false;
    }
  });

  card.querySelector('h2').addEventListener('click', () => { /* noop */ });
}

makeRecorder('cn');
makeRecorder('en');

// ---------- 日历 ----------
function shiftMonth(month, offset) {
  const [year, monthNumber] = month.split('-').map(Number);
  const date = new Date(year, monthNumber - 1 + offset, 1);
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
}

async function setCurrentDate(date) {
  if (!isViewableDate(date)) return;
  currentDate = date;
  calendarMonth = date.slice(0, 7);
  updateDateHeader();
  await Promise.all([refreshStatus(), loadCalendar()]);
}

function medalFor(score) {
  if (score == null) return '';
  if (score >= 90) return 'gold';
  if (score >= 80) return 'silver';
  return 'bronze';
}

async function loadCalendar() {
  const requestedMonth = calendarMonth;
  const { days } = await api('/api/month?month=' + encodeURIComponent(requestedMonth));
  if (requestedMonth !== calendarMonth) return;
  const [year, monthNumber] = calendarMonth.split('-').map(Number);
  const month = monthNumber - 1;
  document.getElementById('calendarMonth').textContent = `${year}年${monthNumber}月`;
  const first = new Date(year, month, 1);
  const startDow = first.getDay(); // 0=周日
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const byDate = {};
  days.forEach(d => byDate[d.date] = d);
  const dows = ['日', '一', '二', '三', '四', '五', '六'];
  let html = '<div class="calendar">';
  dows.forEach(d => html += `<div class="dow">${d}</div>`);
  for (let i = 0; i < startDow; i++) html += '<div></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const date = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const rec = byDate[date];
    const isToday = date === todayCN();
    const isYesterday = date === yesterdayCN();
    const canSelect = date <= todayCN();
    let cls = 'day';
    let mini = '';
    const cnMedal = medalFor(rec ? rec.cnScore : null);
    const enMedal = medalFor(rec ? rec.enScore : null);
    const medalCount = (cnMedal ? 1 : 0) + (enMedal ? 1 : 0);
    const coinLabels = { gold: '金', silver: '银', bronze: '铜' };
    mini = [cnMedal, enMedal]
      .filter(Boolean)
      .map(type => `<span class="coin ${type}">${coinLabels[type]}</span>`)
      .join('');
    if (medalCount === 2) cls += ' full';
    else if (medalCount === 1) cls += ' half';
    if (isToday) cls += ' today';
    if (canSelect) cls += ' selectable';
    if (date === currentDate) cls += ' selected';
    const scoreHint = rec
      ? [rec.cnScore == null ? '' : `中文${rec.cnScore}`, rec.enScore == null ? '' : `英文${rec.enScore}`].filter(Boolean).join(' · ')
      : '';
    const title = `${isToday ? '切换到今天打卡' : isYesterday ? '补昨天的打卡' : canSelect ? '查看当天记录' : '只能查看过去日期'}${scoreHint ? ` · ${scoreHint}` : ''}`;
    const attrs = canSelect
      ? ` role="button" tabindex="0" data-date="${date}" title="${title}"`
      : ` title="${title}"`;
    html += `<div class="${cls}"${attrs}>${d}${mini ? `<span class="mini">${mini}</span>` : ''}</div>`;
  }
  html += '</div>';
  const calendar = document.getElementById('calendar');
  calendar.innerHTML = html;
  calendar.querySelectorAll('[data-date]').forEach(day => {
    const select = () => setCurrentDate(day.dataset.date);
    day.addEventListener('click', select);
    day.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        select();
      }
    });
  });
}

// ---------- 初始化 ----------
document.getElementById('userName').textContent = user.name;
document.getElementById('backToday').addEventListener('click', () => setCurrentDate(todayCN()));
document.getElementById('calendarPrev').addEventListener('click', () => {
  calendarMonth = shiftMonth(calendarMonth, -1);
  loadCalendar();
});
document.getElementById('calendarNext').addEventListener('click', () => {
  calendarMonth = shiftMonth(calendarMonth, 1);
  loadCalendar();
});
updateDateHeader();
await refreshStatus();
await loadCalendar();
})();
</script>
</body>
</html>
