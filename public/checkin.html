<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>阅读打卡</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="container">
  <div class="topbar">
    <h1>📚 阅读打卡</h1>
    <div class="right"><button class="btn-link" onclick="location.href='/'">🏠 主页</button><span id="userName"></span><button class="btn-link" onclick="logout()">退出</button></div>
  </div>
  <p style="color:var(--sub); font-size:14px; margin-bottom:8px;"><span id="dateLabel">今天</span> <b id="today"></b> · 每天中文 + 英文各 5 分钟 🎙️</p>
  <div class="date-bar" id="dateBar">
    <span id="dateBarText"></span>
    <button class="hidden" type="button" id="backToday">返回今天</button>
  </div>

  <!-- 今日状态 -->
  <div class="card">
    <h2 id="statusTitle">🗓️ 今日打卡</h2>
    <div id="todayStatus" style="font-size:14px; color:var(--sub);">加载中…</div>
  </div>

  <!-- 中文录音 -->
  <div class="card rec-card" id="card-cn">
    <h2>🇨🇳 中文朗读 <span class="status-tag tag-none" id="tag-cn">未打卡</span></h2>
    <div id="rec-cn-area">
      <div class="rec-timer" id="timer-cn">0:00</div>
      <div class="rec-hint" role="status" aria-live="polite" id="hint-cn">点击下方按钮开始录音，5 分钟到会自动停止</div>
      <div class="rec-actions">
        <button class="btn btn-orange" id="start-cn">🎙️ 开始录音</button>
        <button class="btn btn-orange hidden" id="pause-cn">⏸️ 暂停</button>
        <button class="btn btn-red hidden" id="stop-cn">⏹️ 停止</button>
        <button class="btn btn-green hidden" id="save-cn">✅ 保存</button>
        <button class="btn btn-ghost hidden" id="again-cn">🔄 重录</button>
      </div>
      <audio class="rec-audio hidden" id="preview-cn" controls></audio>
      <div class="rec-saved-info hidden" id="saved-cn"></div>
      <div class="score-info hidden" id="score-cn"></div>
    </div>
  </div>

  <!-- 英文录音 -->
  <div class="card rec-card" id="card-en">
    <h2>🇬🇧 English <span class="status-tag tag-none" id="tag-en">未打卡</span></h2>
    <div id="rec-en-area">
      <div class="rec-timer" id="timer-en">0:00</div>
      <div class="rec-hint" role="status" aria-live="polite" id="hint-en">点击下方按钮开始录音，5 分钟到会自动停止</div>
      <div class="rec-actions">
        <button class="btn btn-orange" id="start-en">🎙️ Start</button>
        <button class="btn btn-orange hidden" id="pause-en">⏸️ Pause</button>
        <button class="btn btn-red hidden" id="stop-en">⏹️ Stop</button>
        <button class="btn btn-green hidden" id="save-en">✅ Save</button>
        <button class="btn btn-ghost hidden" id="again-en">🔄 Redo</button>
      </div>
      <audio class="rec-audio hidden" id="preview-en" controls></audio>
      <div class="rec-saved-info hidden" id="saved-en"></div>
      <div class="score-info hidden" id="score-en"></div>
    </div>
  </div>

  <details class="card audio-box" id="audioBox">
    <summary>📦 本地录音箱</summary>
    <p class="audio-box-note">自动保存最近 5 次录音，网络不好也不怕丢 📦</p>
    <p class="audio-box-hint" id="audioBoxHint" role="status" aria-live="polite"></p>
    <div id="audioBoxList">加载中…</div>
  </details>

  <!-- 本月日历 -->
  <div class="card">
    <div class="calendar-heading">
      <h2>📅 打卡日历</h2>
      <span class="coin-stats" id="coinStats" aria-live="polite"></span>
      <div class="calendar-nav">
        <button type="button" id="calendarPrev" aria-label="上月">‹</button>
        <span id="calendarMonth"></span>
        <button type="button" id="calendarNext" aria-label="下月">›</button>
      </div>
    </div>
    <div id="calendar"></div>
  </div>
</div>

<script src="/app.js"></script>
<script>
(async () => {
const MAX_SEC = 300; // 5 分钟
const user = await guard(false);
if (!user) return;
let currentDate = todayCN();
let calendarMonth = thisMonthCN();
const scorePollTokens = { cn: 0, en: 0 };

// ---------- 本地备份：不依赖 localStorage，事务提交后才确认写入 ----------
let dbPromise;
let storageWarned = false;
function warnStorage(error) {
  if (!storageWarned) console.warn('[audio] 本地录音备份不可用', error);
  storageWarned = true;
}
function openAudioDB() {
  if (!dbPromise) dbPromise = new Promise((resolve, reject) => {
    const request = indexedDB.open('checkin-audio-db', 1);
    let expired = false;
    const timer = setTimeout(() => { expired = true; reject(new Error('打开本地录音库超时')); }, 3000);
    request.onupgradeneeded = () => {
      const store = request.result.createObjectStore('recordings', { keyPath: 'id', autoIncrement: true });
      store.createIndex('username', 'username');
    };
    request.onsuccess = () => {
      clearTimeout(timer);
      const db = request.result;
      if (expired) { db.close(); return; }
      db.onversionchange = () => { db.close(); dbPromise = null; };
      resolve(db);
    };
    request.onerror = () => { clearTimeout(timer); reject(request.error); };
    request.onblocked = () => { expired = true; clearTimeout(timer); reject(new Error('本地录音库被占用')); };
  });
  return dbPromise;
}
async function audioTransaction(mode, action) {
  const db = await openAudioDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('recordings', mode);
    let result;
    const timer = setTimeout(() => {
      tx.abort();
      reject(new Error('本地录音操作超时'));
    }, 3000);
    tx.oncomplete = () => { clearTimeout(timer); resolve(result); };
    tx.onabort = tx.onerror = () => { clearTimeout(timer); reject(tx.error || new Error('本地录音操作失败')); };
    try { action(tx.objectStore('recordings'), value => { result = value; }); }
    catch (error) { clearTimeout(timer); tx.abort(); reject(error); }
  });
}
function idbPut(rec) {
  return audioTransaction('readwrite', (store, done) => {
    store.put(rec).onsuccess = event => done(event.target.result);
  });
}
const newestFirst = (a, b) => b.createdAt - a.createdAt || b.id - a.id;
function idbList(username) {
  return audioTransaction('readonly', (store, done) => {
    store.index('username').getAll(username).onsuccess = event => done(event.target.result.sort(newestFirst));
  });
}
function idbMarkUploaded(id) {
  return audioTransaction('readwrite', store => {
    store.get(id).onsuccess = event => {
      const rec = event.target.result;
      if (rec && rec.username === user.username) store.put({ ...rec, uploaded: true });
    };
  });
}
function idbDelete(id) {
  return audioTransaction('readwrite', store => { store.delete(id); });
}
function idbPrune(username, keep = 5) {
  return audioTransaction('readwrite', store => {
    store.index('username').getAll(username).onsuccess = event => {
      event.target.result.sort(newestFirst).slice(keep).forEach(rec => store.delete(rec.id));
    };
  });
}
async function backupAudio(payload, uploaded = false) {
  let id;
  try {
    id = await idbPut({ ...payload, username: user.username, createdAt: Date.now(), uploaded });
    await idbPrune(user.username);
  } catch (error) { warnStorage(error); }
  return id;
}
async function markLocalUploaded(id) {
  if (id == null) return;
  try { await idbMarkUploaded(id); } catch (error) { warnStorage(error); }
}

// 同一个 25 秒期限覆盖上传、读取回复、401 重登与唯一一次重试。
async function uploadAudio(payload) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 25000);
  async function request(path, options, allow401 = false) {
    const res = await fetch(path, { ...options, credentials: 'same-origin', cache: 'no-store', signal: controller.signal });
    let data;
    try { data = await res.json(); }
    catch (error) {
      if (controller.signal.aborted) throw error;
      if (allow401 && res.status === 401) return { unauthorized: true };
      const invalid = new Error(`服务器回复无效（HTTP ${res.status}，非有效 JSON）`);
      invalid.cause = error;
      throw invalid;
    }
    if (allow401 && res.status === 401) return { unauthorized: true };
    if (!res.ok || !data || data.ok !== true) {
      const error = new Error(typeof data?.error === 'string' && data.error ? data.error
        : `服务器未确认成功（HTTP ${res.status}）`);
      error.serverError = true;
      error.status = res.status;
      error.data = data;
      throw error;
    }
    return data;
  }
  try {
    const path = '/api/audio?lang=' + encodeURIComponent(payload.lang) + '&duration=' + payload.duration + '&date=' + encodeURIComponent(payload.date);
    const options = { method: 'POST', headers: { 'Content-Type': payload.blob.type || 'audio/webm' }, body: payload.blob };
    const data = await request(path, options, user.role === 'student');
    if (!data.unauthorized) return data;
    await request('/api/student-login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user.username }),
    });
    return await request(path, options);
  } catch (error) {
    if (controller.signal.aborted) throw new DOMException('上传超时', 'AbortError');
    throw error;
  } finally { clearTimeout(timer); }
}
function uploadErrorMessage(error, backedUp = true) {
  if (error.name === 'AbortError') return backedUp
    ? '上传超时，录音已保存在本地，可稍后补传'
    : '上传超时，本地备份不可用，请勿关闭页面，可再次保存';
  if (error instanceof TypeError) return '网络异常，请检查网络后补传';
  if (error.serverError) return error.message;
  return `保存失败：${error.message || '请重试'}`;
}
const audioBoxHint = document.getElementById('audioBoxHint');
const localBusy = new Set();
let localListVersion = 0;
async function refreshLocalRecordings() {
  const version = ++localListVersion;
  const list = document.getElementById('audioBoxList');
  try {
    const records = await idbList(user.username);
    if (version !== localListVersion) return;
    list.replaceChildren();
    if (!records.length) list.textContent = '暂无本地录音';
    for (const recording of records) {
      const row = document.createElement('div');
      row.className = 'audio-box-row';
      const label = document.createElement('span');
      label.className = 'audio-box-label';
      label.textContent = `${recording.date} ${recording.lang === 'cn' ? '中文' : '英文'} ${fmtDur(recording.duration)} ${recording.uploaded ? '✓已上传' : '⏳待补传'}`;
      row.appendChild(label);
      const addButton = (text, handler) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'btn btn-ghost btn-sm';
        button.textContent = text;
        button.disabled = localBusy.has(recording.id);
        button.addEventListener('click', handler);
        row.appendChild(button);
      };
      addButton(localBusy.has(recording.id) ? '上传中…' : (recording.uploaded ? '🔄重新上传' : '⏳补传'), async () => {
        if (localBusy.has(recording.id)) return;
        localBusy.add(recording.id);
        row.querySelectorAll('button').forEach(button => { button.disabled = true; });
        row.querySelector('button').textContent = '上传中…';
        refreshLocalRecordings();
        audioBoxHint.textContent = '正在上传，请稍候…';
        try {
          const { date, blob, duration, lang } = recording;
          const data = await uploadAudio(Object.freeze({ date, blob, duration, lang }));
          await markLocalUploaded(recording.id);
          audioBoxHint.textContent = '上传成功 ✅';
          toast('上传成功 ✅');
          await Promise.all([refreshStatus(), loadCalendar()]).catch(error => {
            console.error('[audio] 上传成功后刷新失败', error);
            audioBoxHint.textContent = '上传成功，但状态刷新失败，请稍后刷新页面';
          });
          if (data.scoring && recording.date === currentDate) loadScore(recording.lang, true, recording.date);
        } catch (error) {
          console.error('[audio] 上传失败', error);
          audioBoxHint.textContent = uploadErrorMessage(error);
          document.getElementById(`hint-${recording.lang}`).textContent = audioBoxHint.textContent;
          toast(audioBoxHint.textContent);
        } finally {
          localBusy.delete(recording.id);
          await refreshLocalRecordings();
        }
      });
      addButton('删除', async () => {
        if (localBusy.has(recording.id)) return;
        localBusy.add(recording.id);
        try { await idbDelete(recording.id); }
        catch (error) { warnStorage(error); audioBoxHint.textContent = '本地录音删除失败，请稍后重试'; }
        finally { localBusy.delete(recording.id); await refreshLocalRecordings(); }
      });
      list.appendChild(row);
    }
  } catch (error) {
    warnStorage(error);
    if (version === localListVersion) list.textContent = '本地录音箱暂不可用';
  }
}

function coinTypeFor(score) {
  if (score == null) return null;
  if (score >= 90) return 'gold';
  if (score >= 80) return 'silver';
  return 'bronze';
}

function renderScore(lang, response) {
  const el = document.getElementById(`score-${lang}`);
  if (!response.enabled || !response.score) { el.classList.add('hidden'); return 'none'; }
  const s = response.score;
  el.classList.remove('hidden');
  if (s.status === 'pending') { el.textContent = '🔍 评分中…'; return 'pending'; }
  if (s.status === 'done') {
    const coin = coinTypeFor(s.total);
    const coinLabels = { gold: '金', silver: '银', bronze: '铜' };
    const coinHtml = coin ? `<span class="coin ${coin}">${coinLabels[coin]}</span>` : '';
    el.innerHTML = `${coinHtml}总分 ${Math.round(s.total)} · 发音 ${Math.round(s.accuracy)} · 流利度 ${Math.round(s.fluency * 100)}`;
    return 'done';
  }
  el.classList.add('hidden');
  el.textContent = '';
  return s.status;
}

async function loadScore(lang, poll = false, date = currentDate) {
  const token = ++scorePollTokens[lang];
  for (let attempt = 0; attempt < (poll ? 20 : 1); attempt++) {
    if (attempt) await new Promise(resolve => setTimeout(resolve, 3000));
    if (token !== scorePollTokens[lang] || date !== currentDate) return;
    try {
      const response = await api(`/api/score?date=${encodeURIComponent(date)}&lang=${lang}`);
      if (token !== scorePollTokens[lang] || date !== currentDate) return;
      const status = renderScore(lang, response);
      if (status !== 'pending') return;
    } catch (_) { return; }
  }
  if (token === scorePollTokens[lang]) document.getElementById(`score-${lang}`).textContent = '暂未评分';
}

function yesterdayCN() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function isViewableDate(date) {
  return /^\d{4}-\d{2}-\d{2}$/.test(date) && date <= todayCN();
}

function updateDateHeader() {
  const isToday = currentDate === todayCN();
  const isYesterday = currentDate === yesterdayCN();
  document.getElementById('dateLabel').textContent = isToday ? '今天' : isYesterday ? '昨天' : '查看日期';
  document.getElementById('today').textContent = currentDate.replace(/-/g, '.');
  document.getElementById('statusTitle').textContent = isToday
    ? '🗓️ 今日打卡'
    : isYesterday ? '🗓️ 昨日补打卡' : `📖 查看记录 · ${currentDate}`;
  document.getElementById('dateBarText').textContent = isToday
    ? `今天 · ${currentDate}`
    : isYesterday
      ? `🔄 补打卡 ${currentDate}（昨天）`
      : '📖 查看打卡记录（仅可回听，补打卡限昨天）';
  document.getElementById('dateBar').classList.toggle('makeup', isYesterday);
  document.getElementById('dateBar').classList.toggle('view-only', !isToday && !isYesterday);
  document.getElementById('backToday').classList.toggle('hidden', isToday);
}

async function refreshStatus() {
  const requestedDate = currentDate;
  const t = await api('/api/today?date=' + encodeURIComponent(requestedDate));
  if (requestedDate !== currentDate) return;
  updateDateHeader();
  const parts = [];
  const cn = t.cn.saved ? `中文 ✅ ${fmtDur(t.cn.duration)}（${fmtTime(t.cn.uploadedAt)}）` : '中文 ⬜ 未打卡';
  const en = t.en.saved ? `英文 ✅ ${fmtDur(t.en.duration)}（${fmtTime(t.en.uploadedAt)}）` : '英文 ⬜ 未打卡';
  document.getElementById('todayStatus').textContent = `${cn} ｜ ${en}`;
  syncCardState('cn', t.cn);
  syncCardState('en', t.en);
  loadScore('cn');
  loadScore('en');
}

function setRecordingAvailability() {
  Object.values(state).forEach(rec => rec.render());
}

function syncCardState(lang, st) {
  const tag = document.getElementById(`tag-${lang}`);
  const savedInfo = document.getElementById(`saved-${lang}`);
  if (st.saved) {
    tag.textContent = '已打卡';
    tag.className = 'status-tag tag-done';
    const savedSuffix = currentDate < yesterdayCN() ? '' : '（可直接重录覆盖）';
    savedInfo.textContent = `已保存 · 时长 ${fmtDur(st.duration)} · ${fmtTime(st.uploadedAt)}${savedSuffix} `;
    const listenBtn = document.createElement('button');
    listenBtn.type = 'button';
    listenBtn.className = 'btn btn-ghost';
    listenBtn.textContent = '🎧 回听';
    listenBtn.addEventListener('click', async () => {
      const preview = document.getElementById(`preview-${lang}`);
      preview.src = st.url;
      preview.classList.remove('hidden');
      try {
        await preview.play();
      } catch (e) {
        toast('无法播放录音，请稍后重试');
      }
    });
    savedInfo.appendChild(listenBtn);
    savedInfo.classList.remove('hidden');
  } else {
    tag.textContent = '未打卡';
    tag.className = 'status-tag tag-none';
    savedInfo.classList.add('hidden');
  }
}

// ---------- 录音逻辑 ----------
const state = {
  cn: null, en: null
};

function makeRecorder(lang) {
  const area = document.getElementById(`rec-${lang}-area`);
  const timerEl = document.getElementById(`timer-${lang}`);
  const hintEl = document.getElementById(`hint-${lang}`);
  const startBtn = document.getElementById(`start-${lang}`);
  const pauseBtn = document.getElementById(`pause-${lang}`);
  const stopBtn = document.getElementById(`stop-${lang}`);
  const saveBtn = document.getElementById(`save-${lang}`);
  const againBtn = document.getElementById(`again-${lang}`);
  const preview = document.getElementById(`preview-${lang}`);
  const card = document.getElementById(`card-${lang}`);
  const tag = document.getElementById(`tag-${lang}`);

  const rec = {
    state: 'idle', starting: false, stopping: false, uploading: false,
    lang, stream: null, recorder: null, chunks: [], timerInt: null, autoStop: null,
    accMs: 0, sessionStart: 0, blob: null, duration: 0, previewUrl: null,
    localId: null, localBackup: null,
  };
  state[lang] = rec;

  rec.render = () => {
    const viewOnly = currentDate < yesterdayCN();
    const visible = viewOnly ? [] : {
      idle: ['start'], saved: ['start'], recording: ['pause', 'stop'],
      paused: ['pause', 'stop'], recorded: rec.blob?.size > 0 ? ['save', 'again'] : ['again'],
    }[rec.state];
    for (const id of ['start', 'pause', 'stop', 'save', 'again']) {
      const button = document.getElementById(`${id}-${lang}`);
      button.classList.toggle('hidden', !visible.includes(id));
      button.disabled = rec.starting || rec.stopping || rec.uploading;
    }
    pauseBtn.textContent = rec.state === 'paused'
      ? (lang === 'cn' ? '▶️ 继续' : '▶️ Resume')
      : (lang === 'cn' ? '⏸️ 暂停' : '⏸️ Pause');
  };
  rec.reset = () => {
    if (rec.previewUrl) URL.revokeObjectURL(rec.previewUrl);
    rec.previewUrl = null;
    preview.classList.add('hidden');
    preview.src = '';
    rec.blob = null;
    rec.localId = null;
    rec.localBackup = null;
    rec.chunks = [];
    rec.duration = 0;
    rec.state = 'idle';
    timerEl.textContent = '0:00';
    timerEl.style.color = '';
    hintEl.textContent = currentDate < yesterdayCN()
      ? '📖 该日期仅可查看回听，补打卡限昨天'
      : '点击下方按钮开始录音，5 分钟到会自动停止';
    rec.render();
  };
  function recordingError(error) {
    console.error('[audio] 录音失败', error);
    const recorder = rec.recorder;
    if (recorder) {
      recorder.onstop = recorder.ondataavailable = recorder.onerror = null;
      try { if (recorder.state !== 'inactive') recorder.stop(); } catch (_) {}
    }
    clearInterval(rec.timerInt);
    clearTimeout(rec.autoStop);
    stopTracks();
    rec.recorder = null;
    rec.starting = rec.stopping = false;
    rec.reset();
    hintEl.textContent = '录音失败，请检查麦克风后重录';
    toast(hintEl.textContent);
  }
  function fmt(ms) {
    const s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  function elapsedMs() {
    const activeMs = rec.recorder && rec.recorder.state === 'recording'
      ? Date.now() - rec.sessionStart
      : 0;
    return Math.min(rec.accMs + activeMs, MAX_SEC * 1000);
  }
  function renderTimer() {
    timerEl.textContent = fmt(elapsedMs());
  }
  function scheduleAutoStop() {
    clearTimeout(rec.autoStop);
    const remaining = Math.max(0, MAX_SEC * 1000 - rec.accMs);
    rec.autoStop = setTimeout(stopRecording, remaining);
  }
  function stopRecording() {
    clearTimeout(rec.autoStop);
    clearInterval(rec.timerInt);
    if (rec.starting || rec.stopping || !rec.recorder || rec.recorder.state === 'inactive') return;
    rec.stopping = true;
    rec.render();
    if (rec.recorder.state === 'recording') {
      rec.accMs = elapsedMs();
      rec.sessionStart = 0;
    }
    try { rec.recorder.stop(); } catch (e) { recordingError(e); }
  }
  function stopTracks() {
    if (rec.stream) rec.stream.getTracks().forEach(t => t.stop());
    rec.stream = null;
  }

  startBtn.addEventListener('click', async () => {
    if (rec.starting || rec.uploading || !['idle', 'saved'].includes(rec.state)) return;
    const isViewOnly = currentDate < yesterdayCN();
    if (isViewOnly) {
      toast('该日期仅可查看，补打卡限昨天');
      return;
    }
    rec.reset();
    rec.starting = true;
    rec.render();
    try {
      rec.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      rec.starting = false;
      rec.render();
      hintEl.textContent = '无法使用麦克风，请检查权限设置';
      toast(hintEl.textContent);
      return;
    }
    try {
      const types = ['audio/webm', 'audio/mp4', 'audio/ogg'];
      let mime = '';
      for (const t of types) { if (MediaRecorder.isTypeSupported(t)) { mime = t; break; } }
      rec.chunks = [];
      rec.recorder = new MediaRecorder(rec.stream, mime ? { mimeType: mime } : undefined);
      rec.recorder.ondataavailable = e => { if (e.data && e.data.size) rec.chunks.push(e.data); };
      rec.recorder.onerror = recordingError;
      rec.recorder.onstop = () => {
        rec.stopping = false;
        rec.state = 'recorded';
        clearInterval(rec.timerInt);
        clearTimeout(rec.autoStop);
        stopTracks();
        rec.blob = new Blob(rec.chunks, { type: rec.recorder.mimeType });
        rec.duration = Math.round(rec.accMs / 1000);
        timerEl.style.color = '';
        if (!rec.blob.size) {
          hintEl.textContent = '没有录到声音，请重录';
          toast(hintEl.textContent);
          rec.render();
          return;
        }
        // 每次停止都留底；重录/reset 后，旧异步结果不能覆盖新录音的 id。
        const payload = Object.freeze({ lang, date: currentDate, duration: rec.duration, blob: rec.blob });
        rec.localBackup = backupAudio(payload).then(id => {
          if (rec.blob === payload.blob) rec.localId = id;
          refreshLocalRecordings();
          return id;
        });
        rec.previewUrl = URL.createObjectURL(rec.blob);
        preview.src = rec.previewUrl;
        preview.classList.remove('hidden');
        timerEl.textContent = fmt(rec.duration * 1000);
        hintEl.textContent = rec.duration >= 5 ? `录了 ${fmt(rec.duration * 1000)}，听听效果，满意就保存 ✅` : '录音太短了，建议重录哦';
        rec.render();
      };
      rec.accMs = 0;
      rec.sessionStart = Date.now();
      rec.recorder.start();
      rec.timerInt = setInterval(renderTimer, 250);
      scheduleAutoStop();
      pauseBtn.textContent = lang === 'cn' ? '⏸️ 暂停' : '⏸️ Pause';
      rec.starting = false;
      rec.state = 'recording';
      rec.render();
      hintEl.textContent = `录音进行中，5:00 自动停止 · 请大声朗读 🗣️`;
      timerEl.style.color = 'var(--red)';
    } catch (e) { recordingError(e); }
  });

  pauseBtn.addEventListener('click', () => {
    if (rec.starting || rec.stopping || !['recording', 'paused'].includes(rec.state) || !rec.recorder) return;
    if (rec.recorder.state === 'recording') {
      rec.accMs = elapsedMs();
      rec.sessionStart = 0;
      rec.recorder.pause();
      clearInterval(rec.timerInt);
      clearTimeout(rec.autoStop);
      renderTimer();
      pauseBtn.textContent = lang === 'cn' ? '▶️ 继续' : '▶️ Resume';
      hintEl.textContent = '⏸️ 已暂停，点继续接着读';
      rec.state = 'paused';
      rec.render();
    } else if (rec.recorder.state === 'paused') {
      rec.sessionStart = Date.now();
      rec.recorder.resume();
      rec.timerInt = setInterval(renderTimer, 250);
      scheduleAutoStop();
      pauseBtn.textContent = lang === 'cn' ? '⏸️ 暂停' : '⏸️ Pause';
      hintEl.textContent = '录音进行中，5:00 自动停止 · 请大声朗读 🗣️';
      rec.state = 'recording';
      rec.render();
    }
  });

  stopBtn.addEventListener('click', stopRecording);

  againBtn.addEventListener('click', () => {
    if (rec.uploading || rec.state !== 'recorded') return;
    rec.reset();
  });

  saveBtn.addEventListener('click', async () => {
    if (rec.uploading || rec.state !== 'recorded') return;
    if (!rec.blob || rec.blob.size === 0) {
      hintEl.textContent = '没有录到声音，请重录';
      toast(hintEl.textContent);
      return;
    }
    const payload = Object.freeze({ lang, date: currentDate, blob: rec.blob, duration: rec.duration });
    rec.uploading = true;
    rec.render();
    hintEl.textContent = '正在保存，请稍候…';
    // 等待停止时的入库，快速点保存也不会重复创建记录。
    let localId = rec.localId ?? await rec.localBackup;
    if (localId != null) localBusy.add(localId);
    refreshLocalRecordings();
    try {
      const data = await uploadAudio(payload);
      if (localId != null) {
        await markLocalUploaded(localId);
      } else {
        // 兼容停止时未能备份的情况，上传成功后再尝试留底。
        localId = await backupAudio(payload, true);
        rec.localId = localId;
      }
      refreshLocalRecordings();
      toast('保存成功 🎉');
      timerEl.style.color = '';
      preview.classList.add('hidden');
      rec.state = 'saved';
      rec.blob = null;
      rec.chunks = [];
      hintEl.textContent = '保存成功 ✅，可开始新的录音';
      rec.render();
      await refreshStatus().catch(e => {
        console.error('[audio] 保存成功后刷新失败', e);
        hintEl.textContent = '录音已保存，但状态刷新失败，请稍后刷新页面';
      });
      if (data.scoring) {
        renderScore(lang, { enabled: true, score: { status: 'pending' } });
        loadScore(lang, true, payload.date);
      }
    } catch (e) {
      console.error('[audio] 保存失败', e);
      hintEl.textContent = uploadErrorMessage(e, localId != null);
      if (localId == null && e.name !== 'AbortError') hintEl.textContent += '（本地备份不可用，请勿关闭页面，可再次保存）';
      document.getElementById('audioBox').open = true;
      toast(hintEl.textContent);
    } finally {
      localBusy.delete(localId);
      refreshLocalRecordings();
      rec.uploading = false;
      rec.render();
    }
  });

  card.querySelector('h2').addEventListener('click', () => { /* noop */ });
}

makeRecorder('cn');
makeRecorder('en');
Object.values(state).forEach(rec => rec.reset());

// ---------- 日历 ----------
function shiftMonth(month, offset) {
  const [year, monthNumber] = month.split('-').map(Number);
  const date = new Date(year, monthNumber - 1 + offset, 1);
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
}

async function setCurrentDate(date) {
  if (!isViewableDate(date) || date === currentDate) return;
  if (Object.values(state).some(rec => rec.uploading || rec.starting || rec.stopping || ['recording', 'paused', 'recorded'].includes(rec.state))) {
    toast('请先保存或重录当前录音');
    return;
  }
  currentDate = date;
  Object.values(state).forEach(rec => rec.reset());
  calendarMonth = date.slice(0, 7);
  updateDateHeader();
  await Promise.all([refreshStatus(), loadCalendar()]);
}

function medalFor(score) {
  return coinTypeFor(score) || '';
}

async function loadCalendar() {
  const requestedMonth = calendarMonth;
  const encodedMonth = encodeURIComponent(requestedMonth);
  const [{ days }, coins] = await Promise.all([
    api('/api/month?month=' + encodedMonth),
    api('/api/coins?month=' + encodedMonth),
  ]);
  if (requestedMonth !== calendarMonth) return;
  const coinStats = document.getElementById('coinStats');
  if (coins.gold + coins.silver + coins.bronze === 0) {
    coinStats.textContent = '本月暂无金币';
  } else {
    coinStats.innerHTML =
      `<span class="coin gold">金</span>×${coins.gold}` +
      `<span class="coin silver">银</span>×${coins.silver}` +
      `<span class="coin bronze">铜</span>×${coins.bronze}`;
  }
  const [year, monthNumber] = calendarMonth.split('-').map(Number);
  const month = monthNumber - 1;
  document.getElementById('calendarMonth').textContent = `${year}年${monthNumber}月`;
  const first = new Date(year, month, 1);
  const startDow = first.getDay(); // 0=周日
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const byDate = {};
  days.forEach(d => byDate[d.date] = d);
  const dows = ['日', '一', '二', '三', '四', '五', '六'];
  let html = '<div class="calendar">';
  dows.forEach(d => html += `<div class="dow">${d}</div>`);
  for (let i = 0; i < startDow; i++) html += '<div></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const date = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const rec = byDate[date];
    const isToday = date === todayCN();
    const isYesterday = date === yesterdayCN();
    const canSelect = date <= todayCN();
    let cls = 'day';
    let mini = '';
    const cnMedal = rec && rec.cnScore != null && (rec.cnDuration || 0) >= 180 ? medalFor(rec.cnScore) : '';
    const enMedal = rec && rec.enScore != null && (rec.enDuration || 0) >= 180 ? medalFor(rec.enScore) : '';
    const medalCount = (cnMedal ? 1 : 0) + (enMedal ? 1 : 0);
    const coinLabels = { gold: '金', silver: '银', bronze: '铜' };
    mini = [cnMedal, enMedal]
      .filter(Boolean)
      .map(type => `<span class="coin ${type}">${coinLabels[type]}</span>`)
      .join('');
    if (medalCount === 2) cls += ' full';
    else if (medalCount === 1) cls += ' half';
    if (isToday) cls += ' today';
    if (canSelect) cls += ' selectable';
    if (date === currentDate) cls += ' selected';
    const scoreHint = rec
      ? [rec.cnScore == null || (rec.cnDuration || 0) < 180 ? '' : `中文${rec.cnScore}`,
          rec.enScore == null || (rec.enDuration || 0) < 180 ? '' : `英文${rec.enScore}`].filter(Boolean).join(' · ')
      : '';
    const title = `${isToday ? '切换到今天打卡' : isYesterday ? '补昨天的打卡' : canSelect ? '查看当天记录' : '只能查看过去日期'}${scoreHint ? ` · ${scoreHint}` : ''}`;
    const attrs = canSelect
      ? ` role="button" tabindex="0" data-date="${date}" title="${title}"`
      : ` title="${title}"`;
    html += `<div class="${cls}"${attrs}>${d}${mini ? `<span class="mini">${mini}</span>` : ''}</div>`;
  }
  html += '</div>';
  const calendar = document.getElementById('calendar');
  calendar.innerHTML = html;
  calendar.querySelectorAll('[data-date]').forEach(day => {
    const select = () => setCurrentDate(day.dataset.date);
    day.addEventListener('click', select);
    day.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        select();
      }
    });
  });
}

// ---------- 初始化 ----------
document.getElementById('userName').textContent = user.name;
document.getElementById('backToday').addEventListener('click', () => setCurrentDate(todayCN()));
document.getElementById('calendarPrev').addEventListener('click', () => {
  calendarMonth = shiftMonth(calendarMonth, -1);
  loadCalendar();
});
document.getElementById('calendarNext').addEventListener('click', () => {
  calendarMonth = shiftMonth(calendarMonth, 1);
  loadCalendar();
});
updateDateHeader();
refreshLocalRecordings();
await refreshStatus();
await loadCalendar();
})();
